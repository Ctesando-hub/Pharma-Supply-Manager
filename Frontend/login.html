<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/x-icon" href="assets/logo2.ico">
    <title> LOGIN|Pharma Supply Manager</title>
</head>
<body class="body_login">
<header class="login-header fixed-top">
<div class="container-fluid d-flex align-items-center justify-content-between px-4 h-100">

    <div class="d-flex align-items-center gap-3">

        <button id="boton-volver" class="btn-icon" aria-label="Volver">
        <i class="bi bi-arrow-left"></i>
        </button>

        <span class="login-title">
        Pharma Supply Manager </span>

    </div>

</div>
</header>
<main class="login-main container d-flex flex-column align-items-center">

    <!-- BRANDING -->
<div class="login-brand text-center position-relative">

    <div class="brand-bg"></div>

    <div class="brand-content">
        <div class="brand-icon">
        <img src="assets/logo.png" alt="Pharma Supply Logo" class="brand-logo">
    </div>

        <h1 class="brand-title">
        Pharma Supply <span>Manager</span></h1>

        <p class="brand-subtitle">
        GESTIÓN INTEGRAL DE PRODUCTOS FARMACÉUTICOS</p>
    </div>

</div>

    <!-- LOGIN CARD -->
<div class="login-card">

    <h2 class="login-heading">Iniciar sesión</h2>

    <form id="formLogin">

        <!-- USER -->
        <div class="mb-4">
        <label class="form-label-custom">Usuario</label>

        <div class="input-group-custom">
            <i class="bi bi-person"></i>
            <input type="email" id ="email" class="form-control-custom" placeholder="usuario@farmacia.com">
        </div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label-custom">Contraseña</label>

        <div class="input-group-custom">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" class="form-control-custom" placeholder="********">

        </div>
        </div>

        <div class="text-end mb-3">
        <a href="#" class="link-forgot">¿Olvidó su contraseña?</a>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn-login-main">
        Ingresar
        <i class="bi bi-arrow-right"></i></button>

    </form>

</div>

    <!-- STATUS -->
<div class="login-status text-center">

    <div class="status-pill">
        <span class="status-dot"></span>
        Sistema de seguridad activo
    </div>

    <p class="status-text">
        Acceso exclusivo para personal autorizado.
    </p>

</div>

</main>

<!-- FOOTER SIMPLE -->
<footer class="login-footer d-flex justify-content-between align-items-center">
    <span>© 2026 Pharma Supply Manager</span>

    <div>
    <a href="#">Soporte</a>
    <a href="#">Privacidad</a>
    </div>
</footer>

    <script src="js/login.js"></script>
</body>
</html>
