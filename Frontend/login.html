<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/x-icon" href="assets/logo2.ico">

    <title> Login | Pharma Supply Manager</title>
</head>

<body class="login-body">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-4">
        <a href="index.html" class="back-link">← Volver al inicio</a>

        <div class="card shadow-lg p-4 login-card">

            <div class="text-center mb-4">
            <img src="assets/logo.png" width="80" alt="Pharma Supply Manager" class="logo flame">
            <h4 class="mt-3">Iniciar sesión</h4>
            </div>

            <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@farmacia.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="********">
            </div>

            <button class="btn btn-primary w-100 mt-3" type="submit">
                Ingresar
            </button>
            </form>
        <div class="text-center mt-4 small text-muted">
    Acceso exclusivo para personal autorizado.
</div>

        </div>

        </div>
    </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
