<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/x-icon" href="assets/logo2.ico">

    <title>Registro | Pharma Supply Manager</title>
</head>

<body class="login-body">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5">

            <!-- Volver -->
            <a href="index.html" class="back-link">← Volver al inicio</a>

            <div class="card shadow-lg p-4 login-card">

                <div class="text-center mb-4">
                    <img src="assets/logo.png" width="80" alt="Pharma Supply Manager" class="logo flame">
                    <h4 class="mt-3">Crear cuenta</h4>
                </div>

                <form id="registerForm" enctype="multipart/form-data">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" name = "nombre" required title="Nombre">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" class="form-control" name = "apellido" required title="Apellido">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="usuario@farmacia.com" name = "email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name = "password" required title="password">
                    </div>

        <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" id="rol" name = "rol" required title="rol">
                    <option value="">Seleccionar rol</option>
                    <option value="gerente">Gerente</option>
                    <option value="empleado">Empleado</option>
                </select>
            </div>
        <div class="mb-3" id="Group">
                <label class="form-label">Sucursal</label>
                <select class="form-select" id="sucursal" title="Sucursal" name = "sucursal">
                    <option value="">Seleccionar sucursal</option>
                    <option value="1">Sucursal Centro</option>
                    <option value="2">Sucursal Norte</option>
                    <option value="3">Sucursal Sur</option>
                    <option value="4">Sucursal Oeste</option>
                </select>
            </div>

    <div class="mb-3">
                        <label class="form-label">Foto de perfil</label>
                        <input type="file" class="form-control" accept="image/*" title="Foto" name="foto">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Registrarme
                    </button>

                </form>

                <div class="text-center mt-4 login-register">
                    <span>¿Ya tenés cuenta?</span>
                    <a href="login.html">Iniciar sesión</a>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="js/register.js"></script>
</body>
</html>
